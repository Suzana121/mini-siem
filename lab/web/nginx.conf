worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    # nginx's built-in "combined" format -- what app/parsers/nginx_access.py expects.
    access_log /var/log/lab/access.log combined;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        location = / {
            default_type text/plain;
            return 200 "lab web target\n";
        }

        # Login endpoint that always rejects, as a real app would for bad credentials.
        location = /login {
            return 401;
        }

        location = /admin {
            return 403;
        }

        # Everything else is a 404 (nothing is served).
        location / {
            return 404;
        }
    }
}
