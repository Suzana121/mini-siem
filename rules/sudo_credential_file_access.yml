id: sudo-credential-file-access
title: Credential file accessed via sudo
description: A sudo command referenced /etc/shadow, /etc/gshadow or /etc/sudoers, which hold password hashes and privilege configuration.
severity: high
mitre:
  - id: T1003.008
    name: "OS Credential Dumping: /etc/passwd and /etc/shadow"
    tactic: Credential Access
match:
  event.action: sudo_command
  labels.command|contains: [/etc/shadow, /etc/gshadow, /etc/sudoers]
false_positives:
  - Administrators editing sudoers with visudo
