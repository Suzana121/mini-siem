id: win-brute-force-success
title: Successful Windows logon after brute force
description: Repeated failed logons followed by a successful logon from the same IP within ten minutes.
severity: critical
mitre:
  - id: T1110
    name: Brute Force
    tactic: Credential Access
  - id: T1078
    name: Valid Accounts
    tactic: Initial Access
sequence:
  window: 10m
  group_by: [source.ip]
  steps:
    - name: failures
      match:
        event.action: win_logon
        event.outcome: failure
      min_count: 5
    - name: success
      match:
        event.action: win_logon
        event.outcome: success
