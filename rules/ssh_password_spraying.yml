id: ssh-password-spraying
title: SSH password spraying across many accounts
description: One IP address fails SSH logins against five or more distinct usernames within five minutes.
severity: high
mitre:
  - id: T1110.003
    name: "Brute Force: Password Spraying"
    tactic: Credential Access
match:
  event.action: [ssh_login, ssh_invalid_user]
  event.outcome: failure
threshold:
  count: 5
  window: 5m
  group_by: [source.ip]
  distinct: user.name
